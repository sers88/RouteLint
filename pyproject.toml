[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routelint"
version = "0.1.0"
description = "A doctor for Mihomo / Clash.Meta configs: schema + native + semantic lint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mihomo", "clash", "clash-meta", "lint", "validator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[project.scripts]
routelint = "routelint.cli:main"

[project.urls]
Homepage = "https://github.com/example/routelint"

[tool.hatch.build.targets.wheel]
packages = ["src/routelint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

